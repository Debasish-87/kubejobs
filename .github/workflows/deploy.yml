name: KubeJobs Production Deploy

on:
  push:
    branches: [ "main", "aws-prod-latest" ]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  CLUSTER_NAME: kubejobs
  NAMESPACE: kubejobs
  ECR_REPO: 409837635702.dkr.ecr.ap-south-1.amazonaws.com/kubejobs

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4

    # ---------------- AWS ----------------
    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Verify AWS
      run: |
        set -euo pipefail
        aws sts get-caller-identity
        aws eks describe-cluster --name $CLUSTER_NAME --region $AWS_REGION

    # ---------------- kubectl ----------------
    - name: Verify kubectl
      run: |
        set -euo pipefail
        which kubectl
        kubectl version --client

    # ---------------- DOCKER ----------------
    - name: Login to ECR
      run: |
        set -euo pipefail
        aws ecr get-login-password --region $AWS_REGION \
        | docker login --username AWS --password-stdin $ECR_REPO

    - name: Build & Push
      run: |
        set -euo pipefail

        IMAGE_TAG=${{ github.sha }}

        docker build -f deployments/docker/Dockerfile -t kubejobs:$IMAGE_TAG .
        docker tag kubejobs:$IMAGE_TAG $ECR_REPO:$IMAGE_TAG
        docker tag kubejobs:$IMAGE_TAG $ECR_REPO:latest

        docker push $ECR_REPO:$IMAGE_TAG
        docker push $ECR_REPO:latest

        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

    # ---------------- KUBECONFIG (SEPARATE HARD CHECK) ----------------
    - name: Setup kubeconfig
      run: |
        set -euo pipefail

        mkdir -p $HOME/.kube

        aws eks update-kubeconfig \
          --region $AWS_REGION \
          --name $CLUSTER_NAME \
          --kubeconfig $HOME/.kube/config

        export KUBECONFIG=$HOME/.kube/config

        echo "=== VERIFY KUBECONFIG FILE ==="
        test -f $KUBECONFIG
        cat $KUBECONFIG | head -20

        echo "=== VERIFY CLUSTER ACCESS ==="
        kubectl config current-context
        kubectl get nodes

    # ---------------- DEPLOY ----------------
    - name: Deploy to EKS
      run: |
        set -euo pipefail
        export KUBECONFIG=$HOME/.kube/config

        echo "=== APPLY BASE ==="
        kubectl apply -f deployments/kubernetes/namespace.yaml
        kubectl apply -f deployments/kubernetes/serviceaccount.yaml
        kubectl apply -f deployments/kubernetes/limit-range.yaml
        kubectl apply -f deployments/kubernetes/resource-quota.yaml
        kubectl apply -f deployments/kubernetes/network-policy.yaml

        echo "=== SECRET ==="
        kubectl create secret generic app-config \
          --from-literal=REDIS_ADDR=rediss://master.kubejobs-redis.rw0frw.aps1.cache.amazonaws.com:6379 \
          -n $NAMESPACE \
          --dry-run=client -o yaml | kubectl apply -f -

        echo "=== DEPLOY ==="
        kubectl apply -f deployments/kubernetes/api-deployment.yaml
        kubectl apply -f deployments/kubernetes/worker-deployment.yaml
        kubectl apply -f deployments/kubernetes/service.yaml
        kubectl apply -f deployments/kubernetes/keda-scaledobject.yaml

        echo "=== UPDATE IMAGE ==="
        kubectl set image deployment/api api=$ECR_REPO:$IMAGE_TAG -n $NAMESPACE
        kubectl set image deployment/worker worker=$ECR_REPO:$IMAGE_TAG -n $NAMESPACE

        echo "=== WAIT FOR ROLLOUT ==="
        kubectl rollout status deployment/api -n $NAMESPACE --timeout=180s
        kubectl rollout status deployment/worker -n $NAMESPACE --timeout=180s

        echo "=== POD STATUS ==="
        kubectl get pods -n $NAMESPACE -o wide

    # ---------------- LOAD BALANCER ----------------
    - name: Get API URL
      run: |
        set -euo pipefail
        export KUBECONFIG=$HOME/.kube/config

        for i in {1..40}; do
          HOST=$(kubectl get svc api -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          if [ -n "$HOST" ]; then
            echo "API_URL=http://$HOST" >> $GITHUB_ENV
            exit 0
          fi
          sleep 10
        done

        kubectl get svc -n $NAMESPACE
        exit 1

    # ---------------- VERIFY ----------------
    - name: Health check
      run: |
        set -euo pipefail
        curl -f $API_URL/health

    - name: Run tests
      run: |
        set -euo pipefail
        chmod +x test.sh
        BASE_URL=$API_URL ./test.sh || true

    # ---------------- DEBUG ----------------
    - name: Debug on failure
      if: failure()
      run: |
        export KUBECONFIG=$HOME/.kube/config
        kubectl get pods -n $NAMESPACE || true
        kubectl describe pods -n $NAMESPACE || true
        kubectl logs -l app=api -n $NAMESPACE --tail=100 || true
        kubectl logs -l app=worker -n $NAMESPACE --tail=100 || true