name: KubeJobs Production Deploy

on:
  push:
    branches: [ "aws-prod-latest" ]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  CLUSTER_NAME: kubejobs
  NAMESPACE: kubejobs
  ECR_REPO: 409837635702.dkr.ecr.ap-south-1.amazonaws.com/kubejobs

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    # ---------------- AWS (OIDC - SECURE) ----------------
    - name: Configure AWS (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::409837635702:role/github-actions-role
        aws-region: ${{ env.AWS_REGION }}

    # ---------------- VERIFY ----------------
    - name: Verify AWS
      run: |
        set -euo pipefail
        aws sts get-caller-identity

    # ---------------- KUBECTL (stable install) ----------------
    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.28.0'

    # ---------------- DOCKER ----------------
    - name: Login to ECR
      run: |
        aws ecr get-login-password --region $AWS_REGION \
        | docker login --username AWS --password-stdin $ECR_REPO

    - name: Build & Push
      run: |
        set -euo pipefail

        IMAGE_TAG=${{ github.sha }}

        docker build --no-cache -f deployments/docker/Dockerfile -t kubejobs:$IMAGE_TAG .
        docker tag kubejobs:$IMAGE_TAG $ECR_REPO:$IMAGE_TAG
        docker tag kubejobs:$IMAGE_TAG $ECR_REPO:latest

        docker push $ECR_REPO:$IMAGE_TAG
        docker push $ECR_REPO:latest

        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

    # ---------------- KUBECONFIG ----------------
    - name: Setup kubeconfig
      run: |
        set -euo pipefail

        mkdir -p $HOME/.kube

        aws eks update-kubeconfig \
          --region $AWS_REGION \
          --name $CLUSTER_NAME \
          --kubeconfig $HOME/.kube/config

        export KUBECONFIG=$HOME/.kube/config

        kubectl get nodes

    # ---------------- SAFE DEPLOY ----------------
    - name: Deploy
      run: |
        set -euo pipefail
        export KUBECONFIG=$HOME/.kube/config

        echo "Ensuring namespace exists..."
        kubectl get ns $NAMESPACE || kubectl create ns $NAMESPACE

        kubectl apply -f deployments/kubernetes/

        kubectl set image deployment/api api=$ECR_REPO:$IMAGE_TAG -n $NAMESPACE
        kubectl set image deployment/worker worker=$ECR_REPO:$IMAGE_TAG -n $NAMESPACE

        kubectl rollout status deployment/api -n $NAMESPACE --timeout=180s
        kubectl rollout status deployment/worker -n $NAMESPACE --timeout=180s

    # ---------------- LB ----------------
    - name: Get API URL
      run: |
        set -euo pipefail
        export KUBECONFIG=$HOME/.kube/config

        for i in {1..40}; do
          HOST=$(kubectl get svc api -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          if [ -n "$HOST" ]; then
            echo "API_URL=http://$HOST" >> $GITHUB_ENV
            exit 0
          fi
          sleep 10
        done

        echo "LoadBalancer failed"
        exit 1

    # ---------------- VERIFY ----------------
    - name: Health check
      run: |
        curl -f $API_URL/health

    # ---------------- DEBUG ----------------
    - name: Debug
      if: failure()
      run: |
        kubectl get pods -n $NAMESPACE
        kubectl describe pods -n $NAMESPACE
        kubectl logs -l app=api -n $NAMESPACE --tail=100 || true
        kubectl logs -l app=worker -n $NAMESPACE --tail=100 || true