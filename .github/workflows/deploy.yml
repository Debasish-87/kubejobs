name: KubeJobs Production Deploy

on:
  push:
    branches: [ "main", "aws-prod-latest" ]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  CLUSTER_NAME: kubejobs
  NAMESPACE: kubejobs
  ECR_REPO: 409837635702.dkr.ecr.ap-south-1.amazonaws.com/kubejobs

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4

    # ─────────────────────────── AWS ───────────────────────────────────────────
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Verify AWS identity
      run: |
        set -euo pipefail
        aws sts get-caller-identity
        aws eks describe-cluster --name $CLUSTER_NAME --region $AWS_REGION \
          --query "cluster.status" --output text

    # ─────────────────────────── KUBECTL ───────────────────────────────────────
    - name: Install kubectl v1.28
      run: |
        set -euo pipefail
        curl -sLO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/kubectl
        kubectl version --client

    # ─────────────────────────── KUBECONFIG ────────────────────────────────────
    - name: Setup kubeconfig
      run: |
        set -euo pipefail
        mkdir -p $HOME/.kube

        aws eks update-kubeconfig \
          --region $AWS_REGION \
          --name $CLUSTER_NAME \
          --kubeconfig $HOME/.kube/config

        # Persist KUBECONFIG for ALL subsequent steps
        echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

        echo "=== Current context ==="
        kubectl config current-context

        echo "=== Cluster nodes ==="
        kubectl get nodes -o wide

    # ─────────────────────────── KEDA ──────────────────────────────────────────
    - name: Install KEDA (if not present)
      run: |
        set -euo pipefail

        if kubectl get namespace keda &>/dev/null; then
          echo "KEDA already installed — verifying operator health..."
          kubectl rollout status deployment/keda-operator \
            -n keda --timeout=60s || true
        else
          echo "Installing KEDA v2.14.0..."
          kubectl apply --server-side \
            -f https://github.com/kedacore/keda/releases/download/v2.14.0/keda-2.14.0.yaml

          echo "Waiting for KEDA operator..."
          kubectl rollout status deployment/keda-operator \
            -n keda --timeout=120s
          kubectl rollout status deployment/keda-metrics-apiserver \
            -n keda --timeout=120s

          echo "KEDA ready."
        fi

    # ─────────────────────────── DOCKER / ECR ──────────────────────────────────
    - name: Login to ECR
      run: |
        set -euo pipefail
        aws ecr get-login-password --region $AWS_REGION \
          | docker login --username AWS --password-stdin $ECR_REPO

    - name: Build & Push image to ECR
      run: |
        set -euo pipefail

        IMAGE_TAG=${{ github.sha }}

        docker build --no-cache \
          -f deployments/docker/Dockerfile \
          -t kubejobs:$IMAGE_TAG .

        docker tag kubejobs:$IMAGE_TAG $ECR_REPO:$IMAGE_TAG
        docker tag kubejobs:$IMAGE_TAG $ECR_REPO:latest

        docker push $ECR_REPO:$IMAGE_TAG
        docker push $ECR_REPO:latest

        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
        echo "Pushed: $ECR_REPO:$IMAGE_TAG"

    # ─────────────────────────── BASE MANIFESTS ─────────────────────────────────
    - name: Apply base manifests
      run: |
        set -euo pipefail

        echo "=== Namespace ==="
        kubectl apply -f deployments/kubernetes/namespace.yaml

        echo "=== ServiceAccount ==="
        kubectl apply -f deployments/kubernetes/serviceaccount.yaml

        echo "=== Resource controls ==="
        kubectl apply -f deployments/kubernetes/limit-range.yaml
        kubectl apply -f deployments/kubernetes/resource-quota.yaml
        kubectl apply -f deployments/kubernetes/network-policy.yaml

    # ─────────────────────────── SECRETS ────────────────────────────────────────
    - name: Sync secrets
      run: |
        set -euo pipefail

        # app-config — REDIS_ADDR (TLS) + REDIS_PASSWORD (used by KEDA TriggerAuth)
        kubectl create secret generic app-config \
          --from-literal=REDIS_ADDR=rediss://master.kubejobs-redis.rw0frw.aps1.cache.amazonaws.com:6379 \
          --from-literal=REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }} \
          -n $NAMESPACE \
          --dry-run=client -o yaml | kubectl apply -f -

        echo "Secrets synced."

    # ─────────────────────────── WORKLOADS ──────────────────────────────────────
    - name: Apply workload manifests
      run: |
        set -euo pipefail

        echo "=== Service (NLB / LoadBalancer) ==="
        kubectl apply -f deployments/kubernetes/service.yaml

        echo "=== API Deployment ==="
        kubectl apply -f deployments/kubernetes/api-deployment.yaml

        echo "=== Worker Deployment ==="
        kubectl apply -f deployments/kubernetes/worker-deployment.yaml

        echo "=== Update image tag: $IMAGE_TAG ==="
        kubectl set image deployment/api \
          api=$ECR_REPO:$IMAGE_TAG -n $NAMESPACE
        kubectl set image deployment/worker \
          worker=$ECR_REPO:$IMAGE_TAG -n $NAMESPACE

        echo "=== KEDA ScaledObject + TriggerAuthentication ==="
        kubectl apply -f deployments/kubernetes/keda-scaledobject.yaml

    # ─────────────────────────── ROLLOUT WAIT ───────────────────────────────────
    - name: Wait for rollout
      run: |
        set -euo pipefail

        echo "Waiting for api rollout..."
        kubectl rollout status deployment/api \
          -n $NAMESPACE --timeout=180s

        echo "Waiting for worker rollout..."
        kubectl rollout status deployment/worker \
          -n $NAMESPACE --timeout=180s

        echo "=== Pod status ==="
        kubectl get pods -n $NAMESPACE -o wide

    # ─────────────────────────── LOAD BALANCER ──────────────────────────────────
    - name: Wait for LoadBalancer hostname
      run: |
        set -euo pipefail

        echo "Waiting for NLB hostname (max 400s)..."
        for i in $(seq 1 40); do
          HOST=$(kubectl get svc api -n $NAMESPACE \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)

          if [ -n "$HOST" ]; then
            echo "NLB ready: $HOST"
            echo "API_URL=http://$HOST" >> $GITHUB_ENV
            exit 0
          fi

          echo "  Attempt $i/40 — waiting 10s..."
          sleep 10
        done

        echo "ERROR: NLB hostname not assigned after 400s"
        kubectl get svc -n $NAMESPACE
        exit 1

    # ─────────────────────────── HEALTH CHECK ───────────────────────────────────
    - name: Health check
      run: |
        set -euo pipefail

        echo "Waiting 30s for DNS propagation..."
        sleep 30

        echo "Running health check against $API_URL/health"
        for i in $(seq 1 12); do
          if curl -sf --max-time 10 "$API_URL/health"; then
            echo ""
            echo "Health check passed!"
            exit 0
          fi
          echo "  Attempt $i/12 failed — retrying in 10s..."
          sleep 10
        done

        echo "ERROR: Health check failed after all retries"
        exit 1

    # ─────────────────────────── INTEGRATION TESTS ──────────────────────────────
    - name: Run integration tests
      run: |
        set -euo pipefail
        chmod +x test.sh
        BASE_URL=$API_URL ./test.sh || true

    # ─────────────────────────── SUMMARY ────────────────────────────────────────
    - name: Print deploy summary
      if: success()
      run: |
        echo ""
        echo "╔══════════════════════════════════════════════════╗"
        echo "║         KubeJobs Deploy — SUCCESS                ║"
        echo "╠══════════════════════════════════════════════════╣"
        echo "║  Cluster  : $CLUSTER_NAME"
        echo "║  Namespace: $NAMESPACE"
        echo "║  Image    : $ECR_REPO:$IMAGE_TAG"
        echo "║  API URL  : $API_URL"
        echo "╚══════════════════════════════════════════════════╝"
        echo ""
        kubectl get pods -n $NAMESPACE
        kubectl get svc  -n $NAMESPACE

    # ─────────────────────────── DEBUG ON FAILURE ───────────────────────────────
    - name: Debug on failure
      if: failure()
      run: |
        echo "=== Nodes ==="
        kubectl get nodes -o wide || true

        echo ""
        echo "=== Pods ==="
        kubectl get pods -n $NAMESPACE -o wide || true

        echo ""
        echo "=== Pod describe (events + status) ==="
        kubectl describe pods -n $NAMESPACE || true

        echo ""
        echo "=== API logs ==="
        kubectl logs -l app=api -n $NAMESPACE --tail=150 || true

        echo ""
        echo "=== Worker logs ==="
        kubectl logs -l app=worker -n $NAMESPACE --tail=150 || true

        echo ""
        echo "=== Services ==="
        kubectl get svc -n $NAMESPACE || true

        echo ""
        echo "=== Secrets (keys only, no values) ==="
        kubectl get secret app-config -n $NAMESPACE \
          -o jsonpath='{.data}' | python3 -c \
          "import sys,json; d=json.load(sys.stdin); [print(k) for k in d]" || true

        echo ""
        echo "=== KEDA ScaledObject ==="
        kubectl get scaledobject -n $NAMESPACE || true
        kubectl describe scaledobject worker-scaler -n $NAMESPACE || true

        echo ""
        echo "=== KEDA operator logs ==="
        kubectl logs -l app=keda-operator -n keda --tail=50 || true