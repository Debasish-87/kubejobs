apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kubejobs
  labels:
    app: worker
    component: backend
    version: v2.0.0

spec:
  replicas: 2
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: worker

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: worker
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"

    spec:
      terminationGracePeriodSeconds: 60

      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        # Required by PodSecurity restricted policy
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: worker
          image: 409837635702.dkr.ecr.ap-south-1.amazonaws.com/kubejobs:latest
          imagePullPolicy: Always

          ports:
            - name: metrics
              containerPort: 8081
              protocol: TCP

          env:
            - name: APP_MODE
              value: "worker"

            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: app-config
                  key: REDIS_ADDR

            - name: MAX_RETRY
              value: "3"

            - name: MAX_QUEUE_SIZE
              value: "1000"

            - name: LOG_LEVEL
              value: "info"

            - name: WORKER_CONCURRENCY
              value: "5"

            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"   # ratio = 4 (limit-range max is 4)
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /health
              port: 8081
            failureThreshold: 30
            periodSeconds: 3
            timeoutSeconds: 2

          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5

          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            # Required by PodSecurity restricted policy
            seccompProfile:
              type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: worker