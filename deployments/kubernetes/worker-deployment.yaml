apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kubejobs
  labels:
    app: worker

spec:
  replicas: 3
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: worker

  template:
    metadata:
      labels:
        app: worker

    spec:
      terminationGracePeriodSeconds: 15

      containers:
      - name: worker
        image: kubejobs:latest
        imagePullPolicy: IfNotPresent

        env:
        - name: APP_MODE
          value: "worker"

        - name: REDIS_ADDR
          value: "redis:6379"

        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password

        - name: MAX_RETRY
          value: "3"

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        livenessProbe:
          exec:
            command: ["sh", "-c", "echo ok"]
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3

        readinessProbe:
          exec:
            command: ["sh", "-c", "echo ready"]
          initialDelaySeconds: 5
          periodSeconds: 10

        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 5"]

        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true

      securityContext:
        fsGroup: 1000