apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kubejobs
  labels:
    app: api
    component: backend

spec:
  replicas: 2
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: api
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"

    spec:
      serviceAccountName: kubejobs-sa
      terminationGracePeriodSeconds: 20

      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api
          image: 409837635702.dkr.ecr.ap-south-1.amazonaws.com/kubejobs:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: APP_MODE
              value: "api"

            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: app-config
                  key: REDIS_ADDR

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-config
                  key: REDIS_PASSWORD

            - name: MAX_QUEUE_SIZE
              value: "1000"

            - name: MAX_RETRY
              value: "3"

            - name: LOG_LEVEL
              value: "info"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 3
            timeoutSeconds: 2

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api