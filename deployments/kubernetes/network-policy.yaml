apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubejobs-network-policy
  namespace: kubejobs

spec:
  podSelector: {}

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - podSelector: {}

  egress:
    # Allow internal cluster communication
    - to:
        - podSelector: {}

    # Allow DNS (VERY IMPORTANT)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow Redis (AWS ElastiCache)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0   # tighten later with exact CIDR
      ports:
        - protocol: TCP
          port: 6379