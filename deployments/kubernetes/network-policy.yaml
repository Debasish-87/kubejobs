apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubejobs-network-policy
  namespace: kubejobs

spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api

    - from:
        - podSelector:
            matchLabels:
              app: worker

  egress:
    - to:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: worker

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6379