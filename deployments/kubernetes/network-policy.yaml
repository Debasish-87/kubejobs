apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubejobs-network-policy
  namespace: kubejobs

spec:
  # Apply policy to all pods in this namespace
  podSelector: {}

  # Enforce both ingress and egress rules
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow traffic ONLY from API and Worker pods (internal communication)
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: worker

  egress:
    - to:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: worker

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    - to:
        - ipBlock:
            cidr: 10.0.0.0/16   
      ports:
        - protocol: TCP
          port: 6380