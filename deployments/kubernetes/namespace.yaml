apiVersion: v1
kind: Namespace
metadata:
  name: kubejobs

  labels:
    name: kubejobs
    environment: production

    app.kubernetes.io/name: kubejobs
    app.kubernetes.io/part-of: job-system
    app.kubernetes.io/managed-by: kubectl

    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

    monitoring: enabled
    logging: enabled

    network-policy: enabled

  annotations:
    description: "KubeJobs distributed job processing system namespace"

    owner: "debasish"
    contact: "infra-team@kubejobs.local"

    cost-center: "kubejobs-prod"