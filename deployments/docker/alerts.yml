groups:
  - name: kubejobs
    rules:

      # Fire if no jobs have been processed in 5 minutes
      - alert: NoJobsProcessed
        expr: rate(jobs_processed_total[5m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No jobs processed in 5 minutes"

      # Fire if the DLQ is growing
      - alert: DLQGrowing
        expr: increase(jobs_failed_total[10m]) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "More than 5 jobs failed in the last 10 minutes"

      # Fire if queue depth is too high (backlog)
      - alert: QueueDepthHigh
        expr: queue_depth{stream="jobs_stream"} > 500
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Job queue depth over 500"

      # Fire if a worker has gone quiet
      - alert: WorkerDown
        expr: worker_active == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Worker {{ $labels.worker }} is not active"
