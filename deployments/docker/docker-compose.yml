services:

  redis:
    image: redis:7
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--appendfsync", "everysec",
        "--requirepass", "kubejobs123"
      ]

    volumes:
      - redis_data:/data

    environment:
      - REDIS_PASSWORD=kubejobs123

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "kubejobs123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

    networks:
      - kubejobs-net

  api:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile

    ports:
      - "8080:8080"

    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=kubejobs123
      - APP_MODE=api
      - MAX_QUEUE_SIZE=1000
      - MAX_RETRY=3

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - kubejobs-net

  worker:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile

    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=kubejobs123
      - APP_MODE=worker
      - MAX_RETRY=3
      - WORKER_CONCURRENCY=10

    # ❌ NO PORTS (important for scaling)

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - kubejobs-net

  prometheus:
    image: prom/prometheus

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    ports:
      - "9090:9090"

    depends_on:
      - api
      - worker

    restart: unless-stopped

    networks:
      - kubejobs-net

  grafana:
    image: grafana/grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    restart: unless-stopped

    networks:
      - kubejobs-net

volumes:
  redis_data:

networks:
  kubejobs-net:
    driver: bridge